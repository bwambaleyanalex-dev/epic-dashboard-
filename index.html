<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Spot Bot - Live</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:system-ui;padding:16px}
.card{background:#1e293b;border-radius:12px;padding:16px;margin:8px 0}
h1{margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{background:#334155;padding:8px 12px;border-radius:8px;font-size:14px}
.value{font-size:22px;font-weight:bold;margin-top:6px}
.small{color:#94a3b8;font-size:12px}
</style></head><body>
<h1>Paper Spot Bot</h1>
<div class="small">Separate $10.05 simulated spot account • Live from GitHub</div>
<div class="card" style="border-left:4px solid #22c55e">🔒 Paper trading only. Real-money orders are disabled.</div>
<div id="content">Loading...</div>
<script>
async function load(){
 try{
  const s = await (await fetch('./state.json?v='+Date.now())).json();
  const eq = s.equity || s.total_equity || s.cash || 0;
  const finalEq = eq>0?eq:cash;
  const cash = s.cash || s.available_cash || 0;
  const realized = s.realized_pnl || s.realized || 0;
  const unreal = s.unrealized_pnl || s.unrealized || 0;
  const pos = (s.positions && Object.keys(s.positions).length) || s.open_positions || 0;
  document.getElementById('content').innerHTML = `
  <div class="grid">
   <div class="card"><div class="badge">Mode</div><div class="value" style="color:#38bdf8">${s.mode || 'PAPER'}</div></div>
   <div class="card"><div class="badge">Cash</div><div class="value">$${cash.toFixed(2)}</div></div>
   <div class="card"><div class="badge">Equity</div><div class="value">$${finalEq.toFixed(2)}</div></div>
   <div class="card"><div class="badge">Realized P/L</div><div class="value" style="color:${realized>=0?'#22c55e':'#ef4444'}">$${realized.toFixed(2)}</div></div>
   <div class="card"><div class="badge">Unrealized P/L</div><div class="value">$${unreal.toFixed(2)}</div></div>
   <div class="card"><div class="badge">Open positions</div><div class="value">${pos}</div></div>
  </div>
  <div class="card"><div class="small">Last update: ${new Date().toLocaleString()}</div></div>`;
 }catch(e){ document.getElementById('content').innerHTML = 'Error: '+e.message; }
}
load(); setInterval(load, 10000);
</script>
</body></html>
